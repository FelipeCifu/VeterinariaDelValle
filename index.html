<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agendar cita | Huellas del Valle</title>
  <style>
    :root { --green:#16765b; --green-dark:#105944; --ink:#1f2937; --muted:#64748b; --line:#dbe4e1; --bg:#f3f7f5; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,Helvetica,sans-serif; background:var(--bg); color:var(--ink); }
    .shell { max-width:900px; margin:0 auto; padding:28px 16px 48px; }
    header { background:linear-gradient(135deg,#155e4a,#269875); color:#fff; border-radius:20px; padding:28px; margin-bottom:22px; box-shadow:0 12px 28px #174d3b1c; }
    .brand { display:flex; align-items:center; gap:14px; }
    .paw { width:54px; height:54px; display:grid; place-items:center; border-radius:16px; background:#ffffff22; font-size:30px; }
    h1 { margin:0 0 7px; font-size:clamp(24px,4vw,34px); }
    header p { margin:0; color:#e5fff5; line-height:1.5; }
    .panel { background:#fff; border:1px solid var(--line); border-radius:18px; padding:24px; box-shadow:0 8px 24px #174d3b0a; }
    .panel h2 { margin:0 0 5px; font-size:21px; }
    .intro { margin:0 0 22px; color:var(--muted); line-height:1.5; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:17px; }
    .field { display:flex; flex-direction:column; gap:7px; }
    .field.full { grid-column:1 / -1; }
    label { font-size:14px; font-weight:700; }
    input, select { width:100%; min-height:46px; padding:11px 12px; border:1px solid #cbd5d1; border-radius:10px; background:#fff; color:var(--ink); font:inherit; }
    input:focus, select:focus { outline:3px solid #bcebd9; border-color:var(--green); }
    .actions { display:flex; align-items:center; gap:14px; margin-top:22px; flex-wrap:wrap; }
    button { border:0; border-radius:11px; padding:14px 20px; background:var(--green); color:#fff; font-size:15px; font-weight:700; cursor:pointer; }
    button:hover { background:var(--green-dark); }
    button:disabled { opacity:.6; cursor:wait; }
    .hint { font-size:12px; color:var(--muted); line-height:1.5; }
    .result { display:none; margin-top:20px; padding:16px; border-radius:12px; line-height:1.5; white-space:pre-wrap; overflow-wrap:anywhere; }
    .result.success { display:block; background:#e8f8ef; color:#155e3d; border:1px solid #a8e0bd; }
    .result.warning { display:block; background:#fff7df; color:#805b00; border:1px solid #f1d47a; }
    .result.error { display:block; background:#fff0ef; color:#9b2924; border:1px solid #f0b7b3; }
    footer { text-align:center; margin-top:18px; color:var(--muted); font-size:12px; }
    @media (max-width:620px) { .grid { grid-template-columns:1fr; } .field.full { grid-column:auto; } .panel { padding:18px; } header { padding:22px; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">
        <div class="paw" aria-hidden="true">🐾</div>
        <div>
          <h1>Clínica Veterinaria Huellas del Valle</h1>
          <p>Solicitud de citas para perros y gatos</p>
        </div>
      </div>
    </header>

    <section class="panel">
      <h2>Agendar una cita</h2>
      <p class="intro">Completa los datos. Consultaremos la disponibilidad y te mostraremos la respuesta del sistema.</p>
      <form id="bookingForm">
        <div class="grid">
          <div class="field">
            <label for="propietario">Nombre del propietario *</label>
            <input id="propietario" name="propietario" autocomplete="name" required placeholder="Ej. Felipe Cifuentes">
          </div>
          <div class="field">
            <label for="correo">Correo electrónico *</label>
            <input id="correo" name="correo" type="email" autocomplete="email" required placeholder="nombre@correo.com">
          </div>
          <div class="field">
            <label for="mascota">Nombre de la mascota *</label>
            <input id="mascota" name="mascota" required placeholder="Ej. Luna">
          </div>
          <div class="field">
            <label for="especie">Especie *</label>
            <select id="especie" name="especie" required>
              <option value="">Selecciona una especie</option>
              <option value="Perro">Perro</option>
              <option value="Gato">Gato</option>
            </select>
          </div>
          <div class="field">
            <label for="servicio">Servicio veterinario *</label>
            <select id="servicio" name="servicio" required>
              <option value="">Selecciona un servicio</option>
              <option value="Consulta general">Consulta general</option>
              <option value="Vacunación">Vacunación</option>
              <option value="Baño">Baño</option>
              <option value="Ecografía">Ecografía</option>
            </select>
          </div>
          <div class="field">
            <label for="fecha">Fecha de la cita *</label>
            <input id="fecha" name="fecha" type="date" required>
          </div>
          <div class="field">
            <label for="hora">Hora disponible *</label>
            <select id="hora" name="hora" required>
              <option value="">Selecciona una hora</option>
              <option value="08:00">08:00</option>
              <option value="09:00">09:00</option>
              <option value="10:00">10:00</option>
              <option value="11:00">11:00</option>
            </select>
          </div>
        </div>
        <div class="actions">
          <button id="submitButton" type="submit">Agendar cita</button>
          <span class="hint">Los campos con * son obligatorios.</span>
        </div>
      </form>
      <div id="result" class="result" role="status" aria-live="polite"></div>
    </section>
    <footer>Huellas del Valle S.A.S. · Sistema de agendamiento automatizado</footer>
  </main>

  <script>
    // Webhook del Escenario 1 de Make.
    const MAKE_WEBHOOK_URL = "https://hook.us2.make.com/d61yggbvxqmu92otu6qdupc3261ij9g8";

    const form = document.getElementById("bookingForm");
    const button = document.getElementById("submitButton");
    const resultBox = document.getElementById("result");
    const dateInput = document.getElementById("fecha");

    // Evita elegir una fecha anterior a hoy.
    const today = new Date();
    const localToday = new Date(today.getTime() - today.getTimezoneOffset() * 60000)
      .toISOString().slice(0, 10);
    dateInput.min = localToday;

    function showResult(kind, message) {
      resultBox.className = "result " + kind;
      resultBox.textContent = message;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;

      const formData = new FormData(form);
      const payload = Object.fromEntries(formData.entries());

      button.disabled = true;
      button.textContent = "Enviando solicitud…";
      resultBox.className = "result";
      resultBox.textContent = "";

      try {
        // URL-encoded evita la solicitud OPTIONS (preflight) del navegador.
        const body = new URLSearchParams(payload);
        const response = await fetch(MAKE_WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
          body: body.toString()
        });

        const responseText = await response.text();
        let data;
        try { data = JSON.parse(responseText); }
        catch { data = { mensaje: responseText }; }

        if (!response.ok) {
          throw new Error(data.mensaje || data.message || ("Make respondió con HTTP " + response.status));
        }

        const estado = String(data.estado || data.resultado || data.status || "").toUpperCase();
        const mensaje = data.mensaje || data.message || "La solicitud llegó a Make. Revisa el resultado de la ejecución si no aparece un estado detallado.";

        if (estado.includes("RECHAZ")) {
          showResult("error", "Solicitud rechazada\n" + mensaje);
        } else if (estado.includes("ALERTA")) {
          showResult("warning", "Cita registrada con alerta\n" + mensaje);
        } else if (estado.includes("CONFIRM")) {
          showResult("success", "Cita confirmada\n" + mensaje);
        } else {
          showResult("success", "Respuesta recibida\n" + mensaje);
        }
      } catch (error) {
        showResult("error",
          "No fue posible leer la respuesta de Make desde la página.\n\n" +
          "Esto puede ocurrir si falta configurar CORS en el módulo Webhook Response. " +
          "Revisa el historial de Make para confirmar si el escenario sí se ejecutó.\n\n" +
          "Detalle: " + error.message);
      } finally {
        button.disabled = false;
        button.textContent = "Agendar cita";
      }
    });
  </script>
</body>
</html>
